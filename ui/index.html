<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
  <title>RIGS OS</title>
  <meta name="description" content="RIGS OS · JARVIS — your mesh of machines and agents, with a voice.">
  <meta name="theme-color" content="#04060a">
  <meta name="color-scheme" content="dark">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="JARVIS">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <link rel="icon" href="/icon-192.png" sizes="192x192" type="image/png">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="stylesheet" href="/dist/app.css">
</head>
<body>
  <main id="graph" aria-label="Mesh galaxy — use the Top hubs list in the side panel to browse machines by keyboard"></main>

  <aside id="left" class="panel" aria-label="Mesh inspector">
    <div class="brand">
      <h1 class="title">RIGS OS</h1>
      <div id="counts" class="sub">connecting…</div>
      <button id="back" class="back" style="visibility:hidden">← back to mesh</button>
    </div>
    <input id="search" class="search" aria-label="Search the mesh" placeholder="Search the mesh…" autocomplete="off" spellcheck="false">
    <div id="search-results"></div>
    <section><h2 class="sec-h">Inspector</h2><div id="inspector"></div></section>
    <section><h2 class="sec-h">Apps</h2><div id="app-list"></div></section>
    <section><h2 class="sec-h">Top hubs</h2><div id="hubs"></div></section>
    <section>
      <h2 class="sec-h">Forces</h2>
      <label class="slider">Repel <input id="repel" type="range" min="20" max="400"></label>
      <label class="slider">Link length <input id="linklen" type="range" min="8" max="80"></label>
    </section>
    <section>
      <h2 class="sec-h">Display</h2>
      <label class="check" title="The 3D mesh galaxy behind everything. Hidden, it is not drawn at all: no GPU or memory used"><input id="d-cloud" type="checkbox"> cloud (3D galaxy)</label>
      <label class="check"><input id="d-labels" type="checkbox"> labels</label>
      <label class="check"><input id="d-particles" type="checkbox"> traffic</label>
      <label class="check"><input id="d-rotate" type="checkbox"> orbit</label>
      <label class="check"><input id="d-autosess" type="checkbox"> auto-open new agent sessions</label>
      <label class="check"><input id="d-notify" type="checkbox"> notifications</label>
      <label class="check"><input id="d-attnbanner" type="checkbox"> "agent needs you" banner</label>
      <label class="check">theme <select id="d-theme" class="mini" aria-label="UI theme"></select></label>
      <label class="check">exhibit animations <select id="d-exanim" class="mini" aria-label="Exhibit animations" title="off: never · auto: only the stage running now · always: every card while work runs (never while idle, hidden, on reduced motion or low power)"><option value="off">off</option><option value="auto">auto</option><option value="always">always</option></select></label>
    </section>
  </aside>

  <nav id="topbar" aria-label="Graph view">
    <button id="fit" class="pill" title="Fit the whole mesh">◎ Fit</button>
    <button id="refresh" class="pill" title="Rescan the tailnet" aria-label="Rescan the tailnet">↻</button>
    <button id="cloud-toggle" class="pill" aria-pressed="true" aria-label="Show the cloud (3D galaxy)" title="Hide the cloud — the 3D mesh galaxy">☁</button>
  </nav>

  <aside id="legend" class="panel" aria-label="Filters"><h2 class="sec-h">Filters</h2><div id="filters"></div></aside>

  <section id="orb-wrap" aria-label="JARVIS">
    <div id="face" role="button" tabindex="0" aria-label="JARVIS face — enlarge" title="JARVIS — click to enlarge"></div>
    <canvas id="orb" role="button" tabindex="0" aria-label="Talk to JARVIS" title="Click to talk"></canvas>
    <div id="orb-state"></div>
    <button id="brain-badge" class="pill" title="Switch brain (model + machine)"></button>
    <div id="brain-menu" class="panel"></div>
  </section>

  <aside id="questions" class="panel" aria-label="Questions — agents waiting for you"></aside>
  <aside id="work" class="panel" aria-label="Active projects"></aside>
  <aside id="usage" class="panel" aria-label="Tokens and time — what each model spent on which tasks"></aside>
  <aside id="desktops" class="panel" aria-label="Desktops — live screens of your online machines"></aside>
  <aside id="traces" class="panel" aria-label="Request traces — look back at how each request was handled"></aside>
  <aside id="agents" class="panel" aria-label="Active agents"></aside>
  <aside id="graphify" class="panel" aria-label="Graphify — the mesh graph in a window"></aside>

  <section id="chat-dock" aria-label="Conversation with JARVIS">
    <div class="dock-head"><span id="dock-target" title="Chatting with JARVIS">◆ JARVIS</span><span id="dock-tier" class="hidden" title="Answered by the local responder"></span><button id="dock-detach" class="pclose hidden" title="Detach — talk to JARVIS again" aria-label="Detach — talk to JARVIS again">⏏</button></div>
    <div id="subtitle" aria-label="Open the conversation with JARVIS"></div>
  </section>

  <aside id="ask-panel" class="panel" aria-label="Ask JARVIS">
    <div class="wk-head ask-head"><span class="wk-title">Ask JARVIS</span></div>
    <div id="ask-row" class="ask-row">
      <input id="ask" aria-label="Ask JARVIS" autocomplete="off" spellcheck="false" placeholder="Ask JARVIS…">
      <button id="btn-mic" class="round" title="Push to talk" aria-label="Push to talk">🎙</button>
      <button id="btn-hands" class="round" aria-pressed="false" title="Hands-free — just say “Jarvis…”" aria-label="Hands-free — just say “Jarvis…”">👂</button>
      <button id="ask-send" class="round" title="Send (Enter)" aria-label="Send">➤</button>
    </div>
  </aside>

  <nav id="bar" aria-label="JARVIS controls">
    <button id="btn-term" class="round" title="Terminal on the focused machine" aria-label="Terminal on the focused machine">⌨</button>
    <button id="btn-files" class="round" title="Files on the focused machine" aria-label="Files on the focused machine">📁</button>
    <button id="btn-desk" class="round" title="Remote desktop to the focused machine" aria-label="Remote desktop to the focused machine">🖥</button>
    <button id="btn-sess" class="round" title="All sessions on all machines" aria-label="All sessions on all machines">💬</button>
    <button id="btn-proj" class="round" title="Projects — plan and delegate work across machines and models" aria-label="Projects — plan and delegate work across machines and models">📋</button>
    <button id="btn-ask" class="round" title="Questions — agents waiting for your answer" aria-label="Questions — agents waiting for your answer">❓<span id="ask-count" class="btn-count" hidden></span></button>
    <button id="btn-agents" class="round" title="Active agents — every live agent session, one click to attach" aria-label="Active agents — every live agent session, one click to attach">🤖<b id="agents-badge" class="ag-badge" hidden></b></button>
    <button id="btn-work" class="round" title="Active projects — running projects and their progress" aria-label="Active projects — running projects and their progress">📊</button>
    <button id="btn-usage" class="round" title="Tokens &amp; time — what each model spent on which tasks" aria-label="Tokens and time — what each model spent on which tasks">⏱</button>
    <button id="btn-desktops" class="round" title="Desktops — live screens of your machines" aria-label="Desktops — live screens of your machines">🖼</button>
    <button id="btn-graphify" class="round" title="Graphify — the mesh graph in a window you can move, dock and close" aria-label="Graphify — the mesh graph in a window you can move, dock and close">🕸</button>
    <button id="btn-traces" class="round" title="Request traces — every request in 3D: stages, inputs and outputs, tool calls" aria-label="Request traces — every request in 3D: stages, inputs and outputs, tool calls">🧭</button>
    <button id="btn-apps" class="round" title="Apps — web apps hosted on your machines, opened right here" aria-label="Apps — web apps hosted on your machines, opened right here">▦</button>
    <button id="btn-mesh" class="round" title="Mesh control, updates, settings" aria-label="Mesh control, updates, settings">⚙</button>
    <button id="btn-mute" class="round" aria-pressed="false" title="Voice output on/off" aria-label="Voice output on/off">🔊</button>
  </nav>
  <footer id="footer">RIGS OS · OpenRig · REA · built with Claude Code</footer>

  <script type="module" src="/dist/app.js"></script>
</body>
</html>
