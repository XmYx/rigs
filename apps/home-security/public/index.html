<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="dark light">
  <title>Home Security</title>
  <!-- Relative URLs only: the App Cloud serves this page under /api/nodes/<node>/apps/home-security/. -->
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 100 100%27%3E%3Ctext y=%27.9em%27 font-size=%2790%27%3E%F0%9F%93%B9%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="app.css">
  <script src="vendor/hls.min.js" defer></script>
  <script src="app.js" type="module"></script>
</head>
<body>
  <header class="top">
    <div class="brand"><span class="logo" aria-hidden="true">📹</span><span>Home Security</span></div>
    <nav class="tabs" role="tablist" aria-label="Views">
      <button role="tab" data-view="live" aria-selected="true"><span class="ti" aria-hidden="true">▦</span><span>Live</span></button>
      <button role="tab" data-view="timeline"><span class="ti" aria-hidden="true">⏱</span><span>Timeline</span></button>
      <button role="tab" data-view="events"><span class="ti" aria-hidden="true">◉</span><span>Events</span></button>
      <button role="tab" data-view="settings"><span class="ti" aria-hidden="true">⚙</span><span>Settings</span></button>
    </nav>
    <div class="nodes" id="nodeChips" aria-label="Machines"></div>
  </header>

  <main>
    <!-- LIVE -->
    <section id="view-live" class="view" data-view="live">
      <div class="bar">
        <h1>Live</h1>
        <span class="muted" id="liveSummary"></span>
        <span class="grow"></span>
        <button class="btn ghost" id="liveBack" hidden>← All cameras</button>
      </div>
      <div class="grid" id="liveGrid"></div>
      <div class="empty" id="liveEmpty" hidden>
        <p><strong>No cameras are recording yet.</strong></p>
        <p>Open <a href="#settings" data-goto="settings">Settings</a>, pick the cameras to use and switch them on.</p>
      </div>
    </section>

    <!-- TIMELINE -->
    <section id="view-timeline" class="view" data-view="timeline" hidden>
      <div class="bar wrap">
        <h1>Timeline</h1>
        <div class="seg" id="tlRange" role="group" aria-label="Range">
          <button data-range="3600000">1 h</button><button data-range="21600000">6 h</button><button data-range="86400000" class="on">24 h</button><button data-range="604800000">7 d</button>
        </div>
        <span class="grow"></span>
        <button class="btn ghost" id="tlPrev" aria-label="Earlier">‹</button>
        <button class="btn ghost" id="tlNext" aria-label="Later">›</button>
        <button class="btn ghost" id="tlNow">Now</button>
      </div>
      <div class="tl" id="tl">
        <div class="tl-axis" id="tlAxis"></div>
        <div class="tl-rows" id="tlRows"></div>
        <div class="tl-cursor" id="tlCursor"><span id="tlCursorLabel"></span></div>
      </div>
      <div class="player-bar">
        <button class="btn" id="pbPlay" aria-label="Play">▶</button>
        <div class="seg" id="pbSpeed" role="group" aria-label="Speed"><button data-speed="1" class="on">1×</button><button data-speed="2">2×</button><button data-speed="4">4×</button><button data-speed="8">8×</button></div>
        <button class="btn ghost" id="pbBack" aria-label="Back 10 seconds">−10 s</button>
        <button class="btn ghost" id="pbFwd" aria-label="Forward 10 seconds">+10 s</button>
        <span class="clock" id="pbClock">—</span>
        <span class="grow"></span>
        <label class="muted small">Go to <input type="datetime-local" id="pbGoto" step="1"></label>
      </div>
      <div class="grid" id="pbGrid"></div>
      <p class="empty" id="tlEmpty" hidden>No recordings in this range.</p>
    </section>

    <!-- EVENTS -->
    <section id="view-events" class="view" data-view="events" hidden>
      <div class="bar wrap">
        <h1>Events</h1>
        <span class="grow"></span>
        <select id="evCamera" aria-label="Camera"><option value="">All cameras</option></select>
        <select id="evNode" aria-label="Machine"><option value="">All machines</option></select>
        <input type="date" id="evDate" aria-label="Day">
        <select id="evState" aria-label="State"><option value="">All</option><option value="unreviewed">Not reviewed</option><option value="locked">Locked</option></select>
      </div>
      <div class="cards" id="evList"></div>
      <p class="empty" id="evEmpty" hidden>No motion events match.</p>
      <div class="center"><button class="btn ghost" id="evMore" hidden>Load more</button></div>
    </section>

    <!-- SETTINGS -->
    <section id="view-settings" class="view" data-view="settings" hidden>
      <div class="bar wrap">
        <h1>Settings</h1>
        <span class="grow"></span>
        <label class="muted small">Machine <select id="stNode"></select></label>
      </div>

      <div class="panel">
        <div class="panel-h">
          <h2>Cameras</h2>
          <span class="grow"></span>
          <label class="check small"><input type="checkbox" id="scanProbe"> Probe LAN ports</label>
          <button class="btn" id="scanBtn">Rescan</button>
        </div>
        <p class="muted small" id="scanStatus"></p>
        <div id="camList" class="cam-list"></div>
        <details class="add">
          <summary>Add an IP camera by URL</summary>
          <form id="addForm" class="form" autocomplete="off">
            <label>Name <input name="name" required maxlength="120" placeholder="Front door"></label>
            <label>Stream URL <input name="url" required placeholder="rtsp://192.168.1.40:554/stream1" inputmode="url"></label>
            <label>Username <input name="username" autocomplete="off"></label>
            <label>Password <input name="password" type="password" autocomplete="new-password"></label>
            <div class="row"><button class="btn" type="submit">Add camera</button><span class="msg" id="addMsg"></span></div>
          </form>
        </details>
      </div>

      <form class="panel form" id="setForm" novalidate>
        <div class="panel-h"><h2>Recording &amp; motion</h2></div>
        <div class="cols">
          <label>Default mode
            <select name="recording.defaultMode"><option value="continuous">Continuous</option><option value="motion">Motion only (ring buffer)</option><option value="off">Off</option></select>
          </label>
          <label>Motion sensitivity <output data-for="motion.sensitivity"></output>
            <input type="range" name="motion.sensitivity" min="1" max="100" step="1">
          </label>
          <label>Pre-roll (seconds) <input type="number" name="recording.preRollSeconds" min="0" max="60" step="1"></label>
          <label>Post-roll (seconds) <input type="number" name="recording.postRollSeconds" min="0" max="120" step="1"></label>
          <label>Minimum motion (ms) <input type="number" name="motion.minDurationMs" min="0" max="10000" step="100"></label>
          <label class="check"><input type="checkbox" name="motion.enabled"> Motion detection on</label>
        </div>
        <div class="panel-h"><h2>Storage &amp; retention</h2></div>
        <div class="usage" id="usage"></div>
        <div class="cols">
          <label>Max storage (GB) <input type="number" name="retention.maxGB" min="1" step="1"></label>
          <label>Keep footage (days) <input type="number" name="retention.maxDays" min="1" step="1"></label>
          <label>Keep events (days) <input type="number" name="retention.eventMaxDays" min="1" step="1"></label>
          <label>Keep free on disk (GB) <input type="number" name="retention.minFreeGB" min="0" step="1"></label>
        </div>
        <div class="row">
          <button class="btn" type="submit">Save settings</button>
          <button class="btn ghost" type="button" id="runRetention">Clean up now</button>
          <span class="msg" id="setMsg"></span>
        </div>
      </form>
    </section>
  </main>

  <!-- event player -->
  <dialog id="evDialog" aria-labelledby="evTitle">
    <div class="dlg">
      <div class="dlg-h"><h2 id="evTitle"></h2><button class="btn ghost" id="evClose" aria-label="Close">✕</button></div>
      <video id="evVideo" controls playsinline muted></video>
      <p class="muted small" id="evMeta"></p>
      <div class="row wrap">
        <a class="btn" id="evDownload" download>Download</a>
        <button class="btn ghost" id="evLock"></button>
        <button class="btn ghost" id="evTimeline">Show in timeline</button>
        <span class="grow"></span>
        <button class="btn danger" id="evDelete">Delete</button>
      </div>
    </div>
  </dialog>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
</body>
</html>
